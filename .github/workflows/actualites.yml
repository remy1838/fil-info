name: Actualités et publication
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
    - cron: '0 22,23 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .feed-cache
          key: rss-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rss-
      - name: Récupérer les actualités
        run: python scripts/update_news.py
      - name: Préparer l’aperçu anniversaires
        run: |
          mkdir -p public/anniversaire-heyrieux
          cp anniversaire-heyrieux/index.html public/anniversaire-heyrieux/index.html
          cp anniversaire-heyrieux/ecran.html public/anniversaire-heyrieux/ecran.html
      - name: Actualiser les anniversaires
        run: python scripts/update_birthdays.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
