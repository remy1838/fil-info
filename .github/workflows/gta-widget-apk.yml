name: Compiler le widget GTA VI Samsung
on:
  push:
    branches: [gta-vi-widget]
    paths:
      - 'gta6/android-widget/**'
      - 'gta6/widget.json'
      - '.github/workflows/gta-widget-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Inclure les visuels officiels
        run: |
          python3 - <<'PY'
          import json,pathlib,urllib.request,shutil
          source=pathlib.Path('gta6/widget.json')
          folder=pathlib.Path('gta6/android-widget/app/src/main/assets')
          folder.mkdir(parents=True,exist_ok=True)
          shutil.copy(source,folder/'widget.json')
          data=json.loads(source.read_text())
          for name,url in [(f'image{i}.jpg',u) for i,u in enumerate(data['images'])]+[('logo.png',data['logo'])]:
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=45) as response:
                  (folder/name).write_bytes(response.read())
          PY
      - name: Compiler l'application
        working-directory: gta6/android-widget
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Autoriser l'accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Vérifier les secondes sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r gta6/android-widget/app/build/outputs/apk/debug/app-debug.apk
            adb install -r gta6/android-widget/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w fr.remy.gtaviwidget.test/fr.remy.gtaviwidget.TickInstrumentation | tee /tmp/gta-test.txt
            grep -q "PASS: native RemoteViews" /tmp/gta-test.txt
            adb shell screencap -p /sdcard/widget-preview.png
            adb pull /sdcard/widget-preview.png gta6/android-widget/widget-preview.png
      - name: Préparer le téléchargement
        run: |
          mkdir -p gta6/android-widget/delivery
          cp gta6/android-widget/app/build/outputs/apk/release/app-release.apk gta6/android-widget/delivery/GTA_VI_Widget.apk
          cp gta6/android-widget/widget-preview.png gta6/android-widget/delivery/
          cp /tmp/gta-test.txt gta6/android-widget/delivery/verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GTA_VI_Widget_Samsung
          path: gta6/android-widget/delivery/
          retention-days: 30
