<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#161020">
<title>GTA VI · Compte à rebours</title>
<meta name="description" content="Le compte à rebours GTA VI, avec un visuel officiel Rockstar Games.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161020;color:white;font-family:Arial,Helvetica,sans-serif}
.widget{position:relative;isolation:isolate;width:100%;height:100%;min-height:120px;overflow:hidden;background:linear-gradient(135deg,#492c55,#1b132c 55%,#754858)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%;z-index:-3}
.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(13,8,23,.92),rgba(17,11,27,.28) 75%),linear-gradient(0deg,rgba(12,8,23,.97),transparent 90%)}
.content{width:min(100%,1000px);height:100%;margin:auto;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,4vw,34px)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wordmark{margin:0;font-size:clamp(30px,7vw,58px);font-weight:950;line-height:.82;letter-spacing:-2px;text-shadow:0 2px 12px #0007}.wordmark span{color:#f6a9cf}
.date{font-size:clamp(9px,2vw,12px);font-weight:700;letter-spacing:1px;border:1px solid #ffffff45;padding:8px 10px;border-radius:30px;background:#130e2855;white-space:nowrap}
.bottom{margin-top:12px}.eyebrow{font-size:clamp(9px,2.2vw,12px);font-weight:700;letter-spacing:3px;color:#f3c9e3;margin:0 0 10px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,2vw,16px);max-width:620px}
.cell{padding:10px 4px 8px;text-align:center;border:1px solid #ffffff25;border-radius:12px;background:linear-gradient(135deg,#ffffff19,#ffffff06);backdrop-filter:blur(8px)}
.num{display:block;font-size:clamp(28px,8vw,66px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}.cell:first-child .num{color:#ffb2d8}
.label{display:block;margin-top:5px;font-size:clamp(7px,1.7vw,10px);letter-spacing:1.6px;color:#e6d7e8}
footer{display:flex;justify-content:space-between;gap:8px;font-size:8px;color:#c5b4cb;margin-top:10px}footer a{color:inherit;text-decoration:none}
#released{display:none;font-size:clamp(20px,5vw,42px);font-weight:900;color:#ffb2d8;padding:12px 0}
@media(min-aspect-ratio:2/1){.content{padding:14px 22px}.wordmark{font-size:34px}.eyebrow{margin-bottom:6px}.cell{padding:7px 4px}.num{font-size:clamp(26px,8vh,50px)}.label{font-size:8px}footer{margin-top:6px;font-size:7px}}
@media(max-height:230px){.content{padding:12px 16px}.wordmark{font-size:28px}.date{padding:6px 8px;font-size:9px}.bottom{margin-top:5px}.eyebrow{font-size:8px;letter-spacing:2px;margin-bottom:6px}.cell{padding:6px 3px;border-radius:8px}.num{font-size:30px}.label{font-size:7px;margin-top:3px}footer{font-size:6px;margin-top:5px}}
@media(min-height:650px){.content{justify-content:flex-end;gap:26px;padding-bottom:8vh}.art{object-position:60% center}.shade{background:linear-gradient(0deg,#100b20 3%,#100b20b0 48%,#100b2010 100%)}.top{align-items:end}.wordmark{font-size:70px}.timer{max-width:none}.num{font-size:clamp(36px,9vw,80px)}}
</style>
</head>
<body>
<main class="widget" aria-label="Compte à rebours avant GTA VI">
<img class="art" alt="" referrerpolicy="no-referrer" src="https://www.rockstargames.com/VI/_next/static/media/Jason_and_Lucia_02_landscape.0cosv-uzbpt91.jpg?akim=1&amp;imdensity=1&amp;imwidth=1920">
<div class="shade"></div>
<div class="content">
<div class="top"><h1 class="wordmark">GTA <span>VI</span></h1><div class="date">19 NOVEMBRE 2026</div></div>
<div class="bottom"><p class="eyebrow" id="heading">DIRECTION VICE CITY</p>
<div class="timer" id="timer" role="timer" aria-label="Temps restant">
<div class="cell"><span class="num" id="days">—</span><span class="label">JOURS</span></div>
<div class="cell"><span class="num" id="hours">—</span><span class="label">HEURES</span></div>
<div class="cell"><span class="num" id="minutes">—</span><span class="label">MINUTES</span></div>
<div class="cell"><span class="num" id="seconds">—</span><span class="label">SECONDES</span></div>
</div>
<div id="released">LE JOUR J EST ARRIVÉ</div>
<footer><span>Décompte au 19/11 à 00 h · Paris*</span><a href="https://www.rockstargames.com/VI/" target="_blank" rel="noopener">Visuel © Rockstar Games · Fan widget</a></footer>
</div></div>
</main>
<script>
/* Repère calendaire à minuit à Paris. L'heure de lancement n'est pas affirmée. */
const release = Date.parse('2026-11-19T00:00:00+01:00');
function remaining(now){
 const total=Math.max(0,Math.floor((release-now)/1000));
 return {days:Math.floor(total/86400),hours:Math.floor(total%86400/3600),minutes:Math.floor(total%3600/60),seconds:total%60};
}
function update(){
 const now=Date.now(), t=remaining(now);
 for(const key of ['days','hours','minutes','seconds']) document.getElementById(key).textContent=String(t[key]).padStart(2,'0');
 if(now>=release){document.getElementById('timer').style.display='none';document.getElementById('released').style.display='block';document.getElementById('heading').textContent='BIENVENUE À VICE CITY';}
}
update();setInterval(update,1000);document.addEventListener('visibilitychange',update);
</script>
</body></html>
